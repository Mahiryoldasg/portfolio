name: Morning wake

# Wakes the free Render instance each morning, shortly before the cron-job.org
# keep-alive window opens at 08:03 local. The two tools cover each other:
# cron-job.org runs reliably every 10 minutes but cannot wake a sleeping
# service, because it gives up on the loading page Render serves during
# spin-up and the request never reaches the app. A GitHub runner holds the
# connection open instead, which does wake it, evidenced by earlier runs of a
# deleted every-10-minutes workflow taking 28 and 40 seconds against the 0.2
# seconds a warm request costs.
#
# There is no `schedule:` trigger, deliberately. GitHub did run all three
# morning attempts it was given, but delivered them between 13:08 and 13:15
# local against slots of 07:50, 07:55 and 08:00, roughly five and a quarter
# hours late. For a job whose only value is punctuality that is worse than not
# running at all: it still spends free minutes and still reports success. The
# trigger now comes from cron-job.org, which POSTs to this workflow's dispatch
# endpoint at 07:50 local and keeps time to within seconds.
#
# Dropping the schedule also removes the only way this workflow could be
# switched off behind our backs: GitHub auto-disables *scheduled* workflows in
# public repositories after 60 days without repository activity, and that would
# have taken the dispatch trigger down with it.
#
# 07:50 is close to 08:03 on purpose. Spin-down is 15 minutes, so waking much
# earlier would let the service fall asleep again before the first keep-alive
# ping arrives, which is the failure this exists to prevent. It leaves the
# service idle for 13 minutes at most.
#
# The POST that starts this is documented in README.md under "Keeping the free
# instance awake", including the token it needs.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      # No size limit and a long timeout, which is the whole point: the request
      # has to stay connected through a spin-up measured between 22 and 90
      # seconds. A run reporting a long time_total woke a sleeping service; a
      # fast one found it already awake, and both are fine.
      - name: Wake the site
        run: |
          curl -fsS --max-time 150 --retry 2 --retry-delay 15 \
            -o /dev/null \
            -w "HTTP %{http_code} in %{time_total}s\n" \
            https://mahirgazeloglu.onrender.com/
