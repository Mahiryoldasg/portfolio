name: Keep alive

# The free Render instance spins down after 15 minutes without inbound traffic
# and takes about a minute to wake. For a link that lives on a CV, that cold
# path is the common one rather than the rare one, so this pings the site
# through the working day. It deliberately does not run overnight or at
# weekends: the free tier allows 750 instance hours a month and a service kept
# up around the clock would consume nearly all of them.
#
# Every 10 minutes rather than every 14. GitHub does not guarantee scheduled
# runs start on time and may drop queued ones under load, so the interval
# carries five minutes of slack against the 15 minute spin-down window. The
# offset minutes keep it away from the top of the hour, when that load peaks.
#
# Cron hours are UTC: 06:00-17:59 UTC is 09:00-20:59 in Turkey and 08:00-19:59
# in Central Europe.
#
# GitHub disables scheduled workflows in public repositories after 60 days with
# no repository activity. If the pings stop, re-enable this from the Actions tab.

on:
  schedule:
    - cron: "3,13,23,33,43,53 6-17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # A failure here is worth seeing: it means the site did not answer, which
      # is a genuine outage signal rather than noise. The long timeout absorbs
      # the first wake of the day, which really does take about a minute.
      - name: Ping the site
        run: |
          curl -fsS --max-time 180 --retry 2 --retry-delay 10 \
            -o /dev/null \
            -w "HTTP %{http_code} in %{time_total}s\n" \
            https://mahirgazeloglu.onrender.com/
